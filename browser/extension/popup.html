<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --fg: #e8e8e8; --dim: #9a9ea3; --bg: #1a1d21; --line: #2c3036; --accent: #f0a020; --bad: #d07070; }
  body { margin: 0; width: 280px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 14px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  #status { color: var(--dim); }
  #status.bad { color: var(--bad); }
  label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  label input { margin-top: 2px; accent-color: var(--accent); }
  label small { display: block; color: var(--dim); }
  button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #note { color: var(--dim); }
  #note.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1><img src="icon-48.png" alt="">dm Downloads</h1>
  <div id="status">Checking dm…</div>
  <label>
    <input type="checkbox" id="takeover">
    <span>Send downloads to dm
      <small>Anything dm can't fetch stays in the browser. Private windows are never sent.</small>
    </span>
  </label>
  <button id="video">Download this page's video</button>
  <div id="note" hidden></div>
  <button id="show">Show downloads</button>
</main>
<script src="popup.js"></script>
</body>
</html>
